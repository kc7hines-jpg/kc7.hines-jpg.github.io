    async function fetchBootstrap(showSuccessToast = true) {

      }

      const refreshIcon = document.getElementById('refreshIcon');
      if (refreshIcon) refreshIcon.classList.add('animate-spin');

      try {
        const endpoint = `${url}?action=bootstrap&token=${encodeURIComponent(token)}`;
        const res = await fetch(endpoint, { method: 'GET' });
        const data = await res.json();

        if (!data || data.ok === false) {
          throw new Error((data && data.error) || 'Failed to authenticate with Apps Script');
        }

        if (Array.isArray(data.categories) && data.categories.length > 0) {
          state.categories = data.categories;
        }
        if (data.dashboard) {
          state.dashboard = data.dashboard;
        }
        if (Array.isArray(data.planned)) {
          state.planned = data.planned;
        }

        setConnectionMode('live');
        populateCategoryDropdowns();
        populatePlannedCategoryDropdowns();
        renderDashboard();
        renderPlannedList();
        if (showSuccessToast) showToast('Connected & synced with Google Sheet!', 'success');
        return true;
      } catch (err) {

      // Live POST (Content-Type: text/plain avoids CORS preflight)

          })
        });
        const data = await res.json();

        if (!data || data.ok === false) {

        }

        resetLogForm();
        showToast(`Saved ${data.transaction.transaction_id} (${formatMoney(transaction.amount)})`, 'success');
        fetchBootstrap(false);
      } catch (err) {
        // Queue on network/fetch failure; show error if server explicitly rejected
        if (err.message && !err.message.toLowerCase().includes('failed to fetch') && !err.message.toLowerCase().includes('network')) {
          showToast(`Error: ${err.message}`, 'error');

// ... existing code ...
    function savePendingQueue(queue) {
      localStorage.setItem(STORAGE_QUEUE_KEY, JSON.stringify(queue));
      renderPendingQueueUI();
    }

    function queueOfflineItem(kind, payload) {
      const queue = getPendingQueue();
      queue.push({ kind, payload, queued_at: new Date().toISOString() });
      savePendingQueue(queue);
    }

    function renderPendingQueueUI() {
// ... existing code ...
      const { url, token } = getCredentials();
      const remaining = [];
      let syncedCount = 0;

      for (const item of queue) {
        try {
          const kind = item.kind || 'transaction';
          let bodyObj;
          if (kind === 'planned') {
            bodyObj = { token, action: 'add_planned', planned: item.payload };
          } else {
            const txn = item.payload || (() => {
              const { queued_at, ...rest } = item;
              return rest;
            })();
            bodyObj = { token, action: 'add_transaction', transaction: txn };
          }

          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(bodyObj)
          });
          const data = await res.json();
          if (!data || data.ok === false) {
            throw new Error((data && data.error) || 'Sync failed');
          }
          syncedCount++;
        } catch {
          remaining.push(item);
        }
      }

      savePendingQueue(remaining);

      if (syncedCount > 0) {
        showToast(`Synced ${syncedCount} queued item(s)!`, 'success');
        fetchBootstrap(false);
      }
      if (remaining.length > 0) {
        showToast(`${remaining.length} item(s) could not sync yet.`, 'warning');
      }
    }

    function populatePlannedCategoryDropdowns(preferredCat = null, preferredSub = null) {
      const catSelect = document.getElementById('plannedCategorySelect');
      const filtered = state.categories.filter((c) => {
        if (state.plannedType === 'income') {
          return c.type === 'Income' || c.category === 'Special';
        }
        return c.type !== 'Income';
      });

      const uniqueCats = [...new Set(filtered.map((c) => c.category))];
      catSelect.innerHTML = '';
      uniqueCats.forEach((cat) => {
        const opt = document.createElement('option');
        opt.value = cat;
        opt.textContent = cat;
        catSelect.appendChild(opt);
      });

      if (preferredCat && uniqueCats.includes(preferredCat)) {
        catSelect.value = preferredCat;
      }
      handlePlannedCategoryChange(preferredSub);
    }

    function handlePlannedCategoryChange(preferredSub = null) {
      const cat = document.getElementById('plannedCategorySelect').value;
      const subSelect = document.getElementById('plannedSubcategorySelect');
      const subs = state.categories.filter((c) => c.category === cat);

      subSelect.innerHTML = '';
      subs.forEach((item) => {
        const opt = document.createElement('option');
        opt.value = item.subcategory;
        opt.textContent = item.subcategory;
        subSelect.appendChild(opt);
      });

      if (preferredSub && subs.some((s) => s.subcategory === preferredSub)) {
        subSelect.value = preferredSub;
      }
    }
