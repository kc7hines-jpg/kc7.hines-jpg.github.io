<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#070b1e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>Rocket Teeth-Brushing Timer</title>
  <style>
    :root {
      --bg-base: #070b1e;
      --card-bg: #121a3d;
      --card-border: #26356b;
      --inner-bg: #0b112b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --blue: #38bdf8;
      --amber: #fbbf24;
      --pink: #f472b6;
      --green: #34d399;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      background-color: var(--bg-base);
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-base);
      background-image: radial-gradient(circle at 50% 85%, #132052 0%, #070b1e 70%);
      color: var(--text-main);
      min-height: 100dvh;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: max(14px, env(safe-area-inset-top));
      padding-bottom: max(18px, env(safe-area-inset-bottom));
      padding-left: 14px;
      padding-right: 14px;
    }

    /* Main Single-Column App Container */
    .app {
      width: 100%;
      max-width: 430px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 1. Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 2px 4px;
    }

    .title {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
    }

    .sound-btn {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      border-radius: 999px;
      padding: 7px 12px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .sound-btn:active {
      transform: scale(0.96);
    }

    /* 2. Status Banner (Opaque High-Contrast States) */
    .status-banner {
      border-radius: 16px;
      padding: 11px 14px;
      text-align: center;
      background-color: #10244d;
      border: 1.5px solid #2e67b8;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .status-banner.brushing {
      background-color: #102a5c;
      border-color: var(--blue);
    }

    .status-banner.switch {
      background-color: #30220f;
      border-color: var(--amber);
    }

    .status-banner.spit {
      background-color: #36142c;
      border-color: var(--pink);
    }

    .status-banner.done {
      background-color: #0e332b;
      border-color: var(--green);
    }

    .phase-title {
      font-size: 1.08rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.25;
    }

    .phase-sub {
      font-size: 0.84rem;
      color: #cbd5e1;
      margin-top: 3px;
    }

    /* Shared Opaque Card Surface (No backdrop-filter) */
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 13px 14px;
    }

    /* 3. Countdown Clock & Horizontal Rocket Track */
    .clock-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .big-clock {
      font-size: 2.5rem;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
      color: var(--blue);
      line-height: 1;
    }

    .step-pill {
      background-color: var(--inner-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 700;
      color: #e2e8f0;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .track-wrap {
      padding: 12px 10px 4px;
    }

    .track-rail {
      position: relative;
      height: 12px;
      border-radius: 999px;
      background-color: var(--inner-bg);
      border: 1px solid var(--card-border);
    }

    .track-fill {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #38bdf8 0%, #60a5fa 60%, #34d399 100%);
      transition: width 0.35s linear;
    }

    .tick-dot {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
    }

    .tick-switch {
      width: 6px;
      height: 6px;
      background-color: var(--amber);
    }

    .tick-spit {
      width: 8px;
      height: 8px;
      background-color: var(--pink);
    }

    .rocket-marker {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      transition: left 0.35s linear;
      display: flex;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .flame {
      font-size: 0.95rem;
      line-height: 1;
      margin-right: -4px;
      transform: rotate(-90deg);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .rocket-icon {
      font-size: 1.55rem;
      line-height: 1;
      display: inline-block;
      transform: rotate(45deg);
    }

    .rocket-marker.thrusting .flame {
      opacity: 1;
      animation: flameFlicker 0.15s infinite alternate;
    }

    .rocket-marker.hovering {
      animation: rocketHover 0.75s ease-in-out infinite alternate;
    }

    @keyframes flameFlicker {
      from { transform: rotate(-90deg) scale(0.85); }
      to { transform: rotate(-90deg) scale(1.22); }
    }

    @keyframes rocketHover {
      from { transform: translate(-50%, -50%) translateY(0px); }
      to { transform: translate(-50%, -50%) translateY(-4px); }
    }

    .milestones {
      position: relative;
      height: 28px;
      margin-top: 8px;
      font-size: 0.64rem;
      font-weight: 700;
      line-height: 1.15;
      user-select: none;
    }

    .ms-label {
      position: absolute;
      transform: translateX(-50%);
      text-align: center;
      color: var(--text-muted);
    }

    .ms-switch { color: var(--amber); }
    .ms-spit { color: var(--pink); }
    .ms-done { color: var(--green); }

    /* 4. Target Zone Dental Arch Card */
    .zone-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 6px;
    }

    .zone-title-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .zone-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .zone-chip {
      font-size: 0.65rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border-radius: 6px;
      background-color: #1a2757;
      color: var(--blue);
    }

    .zone-chip.next {
      background-color: #3a2a10;
      color: var(--amber);
    }

    .zone-chip.done {
      background-color: #0f382f;
      color: var(--green);
    }

    .zone-name {
      font-size: 0.92rem;
      font-weight: 800;
      color: #ffffff;
      text-align: right;
    }

    .arch-svg {
      width: 100%;
      max-width: 300px;
      height: auto;
      display: block;
      margin: 0 auto;
      user-select: none;
    }

    /* Dental Arch Segment States */
    .arch-seg {
      fill: #1e293b;
      stroke: #334155;
      stroke-width: 2;
      transition: fill 0.2s ease, stroke 0.2s ease;
    }

    .arch-seg.active {
      fill: #1d4ed8;
      stroke: #38bdf8;
      stroke-width: 3;
      filter: drop-shadow(0 0 6px rgba(56, 189, 248, 0.8));
    }

    .arch-seg.next-pulse {
      fill: #1e3a8a;
      stroke: #38bdf8;
      stroke-width: 3;
      animation: pulseNextZone 1s ease-in-out infinite alternate;
    }

    @keyframes pulseNextZone {
      from {
        fill: #172554;
        stroke: #38bdf8;
        filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4));
      }
      to {
        fill: #2563eb;
        stroke: #7dd3fc;
        filter: drop-shadow(0 0 9px rgba(56, 189, 248, 0.95));
      }
    }

    .arch-seg.done {
      fill: #114037;
      stroke: #34d399;
      stroke-width: 2;
    }

    /* 5. Controls */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      width: 100%;
      padding: 15px 14px;
      font-size: 1.02rem;
      color: #ffffff;
      background: linear-gradient(135deg, #38bdf8, #2563eb);
    }

    .btn-primary.mode-switch {
      background: linear-gradient(135deg, #fbbf24, #d97706);
      color: #0f172a;
      animation: btnPulseAmber 1.4s infinite;
    }

    .btn-primary.mode-spit {
      background: linear-gradient(135deg, #f472b6, #db2777);
      color: #ffffff;
      animation: btnPulsePink 1.4s infinite;
    }

    .btn-primary.mode-done {
      background: linear-gradient(135deg, #34d399, #059669);
      color: #052e16;
    }

    @keyframes btnPulseAmber {
      0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.5); }
      50% { box-shadow: 0 0 0 7px rgba(251, 191, 36, 0); }
    }

    @keyframes btnPulsePink {
      0%, 100% { box-shadow: 0 0 0 0 rgba(244, 114, 182, 0.5); }
      50% { box-shadow: 0 0 0 7px rgba(244, 114, 182, 0); }
    }

    .secondary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .btn-secondary {
      padding: 11px 10px;
      font-size: 0.9rem;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      color: #e2e8f0;
    }

    .btn-test {
      padding: 11px 10px;
      font-size: 0.9rem;
      background-color: #2b1536;
      border: 1px solid #7e336e;
      color: #fbcfe8;
    }
  </style>
</head>
<body>
  <main class="app">
    <!-- 1. Header -->
    <header class="header">
      <h1 class="title">🚀 Rocket Brush Timer</h1>
      <button id="soundToggle" class="sound-btn" type="button">🔊 Sound On</button>
    </header>

    <!-- 2. Status Banner -->
    <section id="statusBanner" class="status-banner">
      <div id="phaseTitle" class="phase-title">Ready for Liftoff!</div>
      <div id="phaseSub" class="phase-sub">Switch sides every 15s • Spit in sink every 30s</div>
    </section>

    <!-- 3. Countdown Clock & Horizontal Rocket Launch Track -->
    <section class="card">
      <div class="clock-row">
        <div id="bigClock" class="big-clock">02:00</div>
        <div id="stepPill" class="step-pill">Step 1 of 8</div>
      </div>

      <div class="track-wrap">
        <div class="track-rail">
          <div id="trackFill" class="track-fill"></div>

          <!-- Milestone Dots -->
          <span class="tick-dot tick-switch" style="left: 12.5%;"></span>
          <span class="tick-dot tick-spit"   style="left: 25%;"></span>
          <span class="tick-dot tick-switch" style="left: 37.5%;"></span>
          <span class="tick-dot tick-spit"   style="left: 50%;"></span>
          <span class="tick-dot tick-switch" style="left: 62.5%;"></span>
          <span class="tick-dot tick-spit"   style="left: 75%;"></span>
          <span class="tick-dot tick-switch" style="left: 87.5%;"></span>

          <!-- Moving Rocket -->
          <div id="rocketMarker" class="rocket-marker" style="left: 0%;">
            <span class="flame">🔥</span>
            <span class="rocket-icon">🚀</span>
          </div>
        </div>

        <!-- Milestone Labels -->
        <div class="milestones">
          <span class="ms-label"           style="left: 0%;">0:00</span>
          <span class="ms-label ms-switch" style="left: 12.5%;">0:15</span>
          <span class="ms-label ms-spit"   style="left: 25%;">0:30<br />💧</span>
          <span class="ms-label ms-switch" style="left: 37.5%;">0:45</span>
          <span class="ms-label ms-spit"   style="left: 50%;">1:00<br />💧</span>
          <span class="ms-label ms-switch" style="left: 62.5%;">1:15</span>
          <span class="ms-label ms-spit"   style="left: 75%;">1:30<br />💧</span>
          <span class="ms-label ms-switch" style="left: 87.5%;">1:45</span>
          <span class="ms-label ms-done"   style="left: 100%;">2:00<br />🌟</span>
        </div>
      </div>
    </section>

    <!-- 4. Target Zone 8-Segment Dental Arch SVG -->
    <section class="card">
      <div class="zone-header">
        <div class="zone-title-wrap">
          <span class="zone-label">Target Zone</span>
          <span id="zoneChip" class="zone-chip">Start</span>
        </div>
        <span id="zoneName" class="zone-name">Upper Right Outside</span>
      </div>

      <svg
        class="arch-svg"
        viewBox="0 0 320 175"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-label="Dental Arch Target Zone Guide"
      >
        <!-- Orientation Labels -->
        <text x="160" y="14" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.06em">UPPER ARCH</text>
        <text x="160" y="170" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.06em">LOWER ARCH</text>
        <text x="48" y="92" text-anchor="end" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.05em">RIGHT</text>
        <text x="272" y="92" text-anchor="start" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="0.05em">LEFT</text>

        <!-- Dashed Crosshair Dividers -->
        <line x1="160" y1="20" x2="160" y2="156" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />
        <line x1="54" y1="88" x2="266" y2="88" stroke="#475569" stroke-width="1.5" stroke-dasharray="4 4" />

        <!-- Step 0: Upper Right Outside (Outer Top-Left) -->
        <path id="seg0" class="arch-seg" d="M 64 82 C 64 42, 108 24, 154 24 L 154 40 C 118 40, 82 54, 82 82 Z" />
        <!-- Step 1: Upper Left Outside (Outer Top-Right) -->
        <path id="seg1" class="arch-seg" d="M 166 24 C 212 24, 256 42, 256 82 L 238 82 C 238 54, 202 40, 166 40 Z" />
        <!-- Step 2: Lower Left Outside (Outer Bottom-Right) -->
        <path id="seg2" class="arch-seg" d="M 166 152 C 212 152, 256 134, 256 94 L 238 94 C 238 122, 202 136, 166 136 Z" />
        <!-- Step 3: Lower Right Outside (Outer Bottom-Left) -->
        <path id="seg3" class="arch-seg" d="M 64 94 C 64 134, 108 152, 154 152 L 154 136 C 118 136, 82 122, 82 94 Z" />

        <!-- Step 4: Upper Right Inside (Inner Top-Left) -->
        <path id="seg4" class="arch-seg" d="M 90 82 C 90 58, 122 46, 154 46 L 154 60 C 130 60, 107 68, 107 82 Z" />
        <!-- Step 5: Upper Left Inside (Inner Top-Right) -->
        <path id="seg5" class="arch-seg" d="M 166 46 C 198 46, 230 58, 230 82 L 213 82 C 213 68, 190 60, 166 60 Z" />
        <!-- Step 6: Lower Left Inside (Inner Bottom-Right) -->
        <path id="seg6" class="arch-seg" d="M 166 130 C 198 130, 230 118, 230 94 L 213 94 C 213 108, 190 116, 166 116 Z" />
        <!-- Step 7: Lower Right Inside (Inner Bottom-Left) -->
        <path id="seg7" class="arch-seg" d="M 90 94 C 90 118, 122 130, 154 130 L 154 116 C 130 116, 107 108, 107 94 Z" />
      </svg>
    </section>

    <!-- 5. Manual Tap-to-Confirm Controls -->
    <section class="controls">
      <button id="primaryBtn" class="btn btn-primary" type="button">🚀 Start Brushing</button>
      <div class="secondary-row">
        <button id="resetBtn" class="btn btn-secondary" type="button">↺ Reset</button>
        <button id="testSoundBtn" class="btn btn-test" type="button">🎵 Test Chimes</button>
      </div>
    </section>
  </main>

  <script>
    // 8 Brushing Intervals of 15 Seconds = 120 Seconds Total
    const INTERVALS = [
      { zone: "Upper Right Outside", pauseAfter: "switch" }, // 0:00 -> 0:15
      { zone: "Upper Left Outside",  pauseAfter: "spit"   }, // 0:15 -> 0:30
      { zone: "Lower Left Outside",  pauseAfter: "switch" }, // 0:30 -> 0:45
      { zone: "Lower Right Outside", pauseAfter: "spit"   }, // 0:45 -> 1:00
      { zone: "Upper Right Inside",  pauseAfter: "switch" }, // 1:00 -> 1:15
      { zone: "Upper Left Inside",   pauseAfter: "spit"   }, // 1:15 -> 1:30
      { zone: "Lower Left Inside",   pauseAfter: "switch" }, // 1:30 -> 1:45
      { zone: "Lower Right Inside",  pauseAfter: "finish" }  // 1:45 -> 2:00
    ];

    let elapsedBrush = 0;   // 0 to 120
    let isRunning = false;
    let pauseMode = null;   // null | "switch" | "spit"
    let soundOn = true;
    let timerId = null;
    let audioCtx = null;

    // DOM Elements
    const soundToggle = document.getElementById("soundToggle");
    const statusBanner = document.getElementById("statusBanner");
    const phaseTitle = document.getElementById("phaseTitle");
    const phaseSub = document.getElementById("phaseSub");
    const bigClock = document.getElementById("bigClock");
    const stepPill = document.getElementById("stepPill");
    const trackFill = document.getElementById("trackFill");
    const rocketMarker = document.getElementById("rocketMarker");
    const zoneChip = document.getElementById("zoneChip");
    const zoneName = document.getElementById("zoneName");
    const primaryBtn = document.getElementById("primaryBtn");
    const resetBtn = document.getElementById("resetBtn");
    const testSoundBtn = document.getElementById("testSoundBtn");
    const segEls = Array.from({ length: 8 }, (_, i) => document.getElementById("seg" + i));

    // --- Simple, Proven Web Audio API Sound Engine ---
    function ensureAudio() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === "suspended") {
          audioCtx.resume();
        }
      } catch (e) {
        // Ignore if audio is unavailable
      }
    }

    function playTone(freq, startTime, duration, type, peakGain, slideTo) {
      if (!soundOn || !audioCtx) return;
      try {
        const t0 = Math.max(startTime, audioCtx.currentTime);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type || "sine";
        osc.frequency.setValueAtTime(Math.max(20, freq), t0);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + duration);
        }

        const safePeak = Math.max(0.002, peakGain || 0.28);
        gain.gain.setValueAtTime(0.001, t0);
        gain.gain.exponentialRampToValueAtTime(safePeak, t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(t0);
        osc.stop(t0 + duration + 0.03);
      } catch (e) {
        // Guard against any Web Audio scheduling edge case
      }
    }

    // Gentle tap confirmation blip
    function playConfirmBlip() {
      if (!soundOn) return;
      ensureAudio();
      if (!audioCtx) return;
      playTone(659.25, audioCtx.currentTime, 0.11, "sine", 0.22);
    }

    // 15-Second Switch Sides: 2-tone sci-fi chime
    function playSwitchChime() {
      if (!soundOn) return;
      ensureAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      playTone(587.33, now, 0.14, "triangle", 0.30);        // D5
      playTone(880.00, now + 0.16, 0.24, "triangle", 0.32); // A5
    }

    // 30-Second Spit Break: double alert + water-droplet bloop
    function playSpitAlert() {
      if (!soundOn) return;
      ensureAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      playTone(523.25, now, 0.12, "sine", 0.28);
      playTone(659.25, now + 0.14, 0.12, "sine", 0.28);
      playTone(320, now + 0.30, 0.18, "sine", 0.35, 960);
      playTone(400, now + 0.50, 0.20, "sine", 0.35, 1180);
    }

    // 2-Minute Blast Off: 4-note celebratory fanfare
    function playLaunchFanfare() {
      if (!soundOn) return;
      ensureAudio();
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
      notes.forEach((n, idx) => {
        playTone(n, now + idx * 0.14, idx === 3 ? 0.55 : 0.15, "triangle", 0.32);
      });
    }

    // --- UI Rendering ---
    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
    }

    function updateUI() {
      const remaining = Math.max(0, 120 - elapsedBrush);
      bigClock.textContent = formatTime(remaining);

      const pct = Math.min(100, (elapsedBrush / 120) * 100);
      trackFill.style.width = pct + "%";
      rocketMarker.style.left = pct + "%";

      const stepIdx = Math.min(7, Math.floor(elapsedBrush / 15));
      const current = INTERVALS[stepIdx];
      const secLeftInSlice = elapsedBrush >= 120 ? 0 : (15 - (elapsedBrush % 15));

      // Step pill
      if (elapsedBrush >= 120) {
        stepPill.textContent = "8 of 8 • Done!";
      } else if (pauseMode) {
        stepPill.textContent = "Step " + (stepIdx + 1) + " of 8 • Ready?";
      } else {
        stepPill.textContent = "Step " + (stepIdx + 1) + " of 8 • " + secLeftInSlice + "s";
      }

      // Target Zone SVG + header
      zoneName.textContent = elapsedBrush >= 120 ? "All Zones Clean!" : current.zone;
      segEls.forEach((el, idx) => {
        el.classList.remove("active", "next-pulse", "done");
        if (elapsedBrush >= 120) {
          el.classList.add("done");
        } else if (idx === stepIdx) {
          el.classList.add(pauseMode ? "next-pulse" : "active");
        } else if (idx < stepIdx) {
          el.classList.add("done");
        }
      });

      // Reset visual state classes
      statusBanner.className = "status-banner";
      rocketMarker.classList.remove("thrusting", "hovering");
      primaryBtn.className = "btn btn-primary";
      zoneChip.className = "zone-chip";

      if (elapsedBrush >= 120) {
        statusBanner.classList.add("done");
        phaseTitle.textContent = "🌟 BLAST OFF! Mission Complete!";
        phaseSub.textContent = "All 8 zones sparkling clean! One final spit & rinse.";
        rocketMarker.classList.add("hovering");
        zoneChip.textContent = "Complete";
        zoneChip.classList.add("done");
        primaryBtn.textContent = "🚀 Brush Again";
        primaryBtn.classList.add("mode-done");
      } else if (pauseMode === "switch") {
        statusBanner.classList.add("switch");
        phaseTitle.textContent = "🔄 SWITCH SIDES!";
        phaseSub.textContent = "Move toothbrush to: " + current.zone;
        rocketMarker.classList.add("hovering");
        zoneChip.textContent = "Next Up";
        zoneChip.classList.add("next");
        primaryBtn.textContent = "🔄 Switched Sides — Tap When Ready!";
        primaryBtn.classList.add("mode-switch");
      } else if (pauseMode === "spit") {
        statusBanner.classList.add("spit");
        phaseTitle.textContent = "💧 SPIT IN THE SINK!";
        phaseSub.textContent = "Don't swallow toothpaste! Next: " + current.zone;
        rocketMarker.classList.add("hovering");
        zoneChip.textContent = "Next Up";
        zoneChip.classList.add("next");
        primaryBtn.textContent = "💧 Spat Out — Tap When Ready!";
        primaryBtn.classList.add("mode-spit");
      } else if (isRunning) {
        statusBanner.classList.add("brushing");
        phaseTitle.textContent = "🪥 Brush: " + current.zone;
        const nextLabel =
          current.pauseAfter === "spit" ? "Spit break" :
          current.pauseAfter === "switch" ? "Switch sides" : "Blast off";
        phaseSub.textContent = nextLabel + " in " + secLeftInSlice + "s";
        rocketMarker.classList.add("thrusting");
        zoneChip.textContent = "Brushing";
        primaryBtn.textContent = "⏸ Pause";
      } else {
        phaseTitle.textContent = elapsedBrush === 0 ? "Ready for Liftoff!" : "Mission Paused";
        phaseSub.textContent = elapsedBrush === 0
          ? "Switch sides every 15s • Spit in sink every 30s"
          : "Next up: " + current.zone;
        zoneChip.textContent = elapsedBrush === 0 ? "Start" : "Paused";
        primaryBtn.textContent = elapsedBrush === 0 ? "🚀 Start Brushing" : "▶️ Resume Brushing";
      }
    }

    // --- Timer Loop (Stops cleanly at 15s & 30s marks for manual confirmation) ---
    function tick() {
      if (!isRunning || pauseMode) return;

      elapsedBrush += 1;

      if (elapsedBrush >= 120) {
        isRunning = false;
        clearInterval(timerId);
        playLaunchFanfare();
        updateUI();
        return;
      }

      if (elapsedBrush % 30 === 0) {
        isRunning = false;
        clearInterval(timerId);
        pauseMode = "spit";
        playSpitAlert();
      } else if (elapsedBrush % 15 === 0) {
        isRunning = false;
        clearInterval(timerId);
        pauseMode = "switch";
        playSwitchChime();
      }

      updateUI();
    }

    // --- Event Listeners ---
    primaryBtn.addEventListener("click", () => {
      ensureAudio();

      if (elapsedBrush >= 120) {
        elapsedBrush = 0;
        pauseMode = null;
        isRunning = true;
        playConfirmBlip();
        clearInterval(timerId);
        timerId = setInterval(tick, 1000);
        updateUI();
        return;
      }

      if (pauseMode) {
        pauseMode = null;
        isRunning = true;
        playConfirmBlip();
        clearInterval(timerId);
        timerId = setInterval(tick, 1000);
        updateUI();
        return;
      }

      isRunning = !isRunning;
      clearInterval(timerId);
      if (isRunning) {
        playConfirmBlip();
        timerId = setInterval(tick, 1000);
      }
      updateUI();
    });

    resetBtn.addEventListener("click", () => {
      isRunning = false;
      clearInterval(timerId);
      elapsedBrush = 0;
      pauseMode = null;
      updateUI();
    });

    soundToggle.addEventListener("click", () => {
      soundOn = !soundOn;
      soundToggle.textContent = soundOn ? "🔊 Sound On" : "🔇 Muted";
      if (soundOn) {
        ensureAudio();
        playConfirmBlip();
      }
    });

    testSoundBtn.addEventListener("click", () => {
      if (!soundOn) {
        soundOn = true;
        soundToggle.textContent = "🔊 Sound On";
      }
      ensureAudio();
      playSwitchChime();
      setTimeout(playSpitAlert, 650);
    });

    // Initial render
    updateUI();
  </script>
</body>
</html>
