  <!-- Inline Standalone PWA Manifest -->

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      margin: 0;
      padding: 0;
      width: 100%;
      background-color: #070b1e;
      overscroll-behavior-y: none;
      overscroll-behavior: none;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100dvh;
      background-color: #070b1e;
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior-y: none;
      overscroll-behavior: none;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      padding-left: calc(14px + env(safe-area-inset-left, 0px));
      padding-right: calc(14px + env(safe-area-inset-right, 0px));
    }

    /* Fixed Solid iOS Status Bar & Dynamic Island Guard (Zero Blur Artifacts) */
    .ios-status-guard {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: env(safe-area-inset-top, 0px);
      background-color: #070b1e;
      z-index: 9999;
      pointer-events: none;
    }

    /* Crisp Solid-Backed Starfield (No backdrop-filter) */
    .starfield {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-color: #070b1e;
      background-image:
        radial-gradient(1.5px 1.5px at 24px 48px, rgba(255, 255, 255, 0.85), transparent),
        radial-gradient(2px 2px at 130px 96px, rgba(186, 230, 253, 0.8), transparent),
        radial-gradient(1.2px 1.2px at 240px 168px, rgba(255, 255, 255, 0.7), transparent),
        radial-gradient(2px 2px at 75px 236px, rgba(253, 230, 138, 0.75), transparent),
        radial-gradient(1.5px 1.5px at 310px 64px, rgba(224, 242, 254, 0.8), transparent),
        radial-gradient(1.6px 1.6px at 190px 284px, rgba(244, 114, 182, 0.7), transparent);
      background-size: 340px 310px;
    }

    /* Opaque High-Contrast Card Surfaces */
    .opaque-card {
      background-color: #11193d;
      border: 1px solid #283873;
    }

    /* Horizontal Rocket Marker & Animations */
    .rocket-marker {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      transition: left 0.35s linear;
      display: flex;
      align-items: center;
      pointer-events: none;
      z-index: 10;
    }

    .rocket-emoji {
      display: inline-block;
      font-size: 1.75rem;
      line-height: 1;
      transform: rotate(45deg);
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.65));
    }

    .thruster-flame {
      display: inline-block;
      font-size: 1rem;
      line-height: 1;
      margin-right: -4px;
      transform: rotate(-90deg);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .rocket-marker.thrusting .thruster-flame {
      opacity: 1;
      animation: flamePulse 0.14s infinite alternate;
    }

    .rocket-marker.hovering {
      animation: gentleBob 0.75s ease-in-out infinite alternate;
    }

    @keyframes flamePulse {
      0% { transform: rotate(-90deg) scale(0.85); }
      100% { transform: rotate(-90deg) scale(1.22); }
    }

    @keyframes gentleBob {
      0% { transform: translate(-50%, -50%) translateY(0px); }
      100% { transform: translate(-50%, -50%) translateY(-4px); }
    }

    /* Pulsing Confirmation Buttons */
    @keyframes confirmPulseAmber {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.45); }
      50% { transform: scale(1.015); box-shadow: 0 0 0 8px rgba(251, 191, 36, 0); }
    }

    @keyframes confirmPulsePink {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(244, 114, 182, 0.5); }
      50% { transform: scale(1.015); box-shadow: 0 0 0 8px rgba(244, 114, 182, 0); }
    }

    .pulse-amber {
      animation: confirmPulseAmber 1.5s infinite;
    }

    .pulse-pink {
      animation: confirmPulsePink 1.5s infinite;
    }

    /* Dental Arch SVG Segment States */
    .arch-seg {
      fill: #18234e;
      stroke: #32468a;
      stroke-width: 2;
      transition: fill 0.25s ease, stroke 0.25s ease, filter 0.25s ease;
    }

    .arch-seg-active {
      fill: #1d4ed8;
      stroke: #38bdf8;
      stroke-width: 3;
      filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.85));
    }

    .arch-seg-next-pulse {
      fill: #1e3a8a;
      stroke: #38bdf8;
      stroke-width: 3;
      animation: nextZonePulse 1.1s ease-in-out infinite alternate;
    }

    @keyframes nextZonePulse {
      0% {
        fill: #172554;
        stroke: #38bdf8;
        filter: drop-shadow(0 0 3px rgba(56, 189, 248, 0.4));
      }
      100% {
        fill: #2563eb;
        stroke: #7dd3fc;
        filter: drop-shadow(0 0 11px rgba(56, 189, 248, 0.95));
      }
    }

    .arch-seg-done {
      fill: #103b37;
      stroke: #34d399;
      stroke-width: 2;
    }
  </style>

  <script>
    /**
     * Safe Storage Helpers (In-memory fallback prevents SecurityError in sandboxed iframes)
     */
    const memoryStorage = {};
    function safeGet(key, fallbackVal) {
      try {
        const val = window.localStorage.getItem(key);
        return val !== null ? val : fallbackVal;
      } catch (e) {
        return Object.prototype.hasOwnProperty.call(memoryStorage, key) ? memoryStorage[key] : fallbackVal;
      }
    }
    function safeSet(key, val) {
      memoryStorage[key] = String(val);
      try {
        window.localStorage.setItem(key, String(val));
      } catch (e) {
        // Ignore sandboxed storage write block
      }
    }
    function safeRemove(key) {
      delete memoryStorage[key];
      try {
        window.localStorage.removeItem(key);
      } catch (e) {
        // Ignore sandboxed storage remove block
      }
    }

    /**
     * 8 Brushing Intervals x 15 Seconds = 120 Seconds (2 Minutes)
     * Manual Tap-to-Confirm pauses at every 15s (Switch Sides) and 30s (Spit in Sink).
     */
    const INTERVALS = [
      { seg: 0, zone: "Upper Right Outside", pauseAfter: "switch" }, // 0:00 -> 0:15
      { seg: 1, zone: "Upper Left Outside",  pauseAfter: "spit"   }, // 0:15 -> 0:30
      { seg: 2, zone: "Lower Left Outside",  pauseAfter: "switch" }, // 0:30 -> 0:45
      { seg: 3, zone: "Lower Right Outside", pauseAfter: "spit"   }, // 0:45 -> 1:00
      { seg: 4, zone: "Upper Right Inside",  pauseAfter: "switch" }, // 1:00 -> 1:15
      { seg: 5, zone: "Upper Left Inside",   pauseAfter: "spit"   }, // 1:15 -> 1:30
      { seg: 6, zone: "Lower Left Inside",   pauseAfter: "switch" }, // 1:30 -> 1:45
      { seg: 7, zone: "Lower Right Inside",  pauseAfter: "finish" }  // 1:45 -> 2:00
    ];

    let elapsedBrush = 0;   // 0 to 120 seconds
    let isRunning = false;
    let pauseMode = null;   // null | "switch" | "spit"
    let soundEnabled = safeGet("rocket_brush_sound", "true") !== "false";
    let timerId = null;

    // DOM Elements
    const soundToggle = document.getElementById("soundToggle");
    const testSoundBtn = document.getElementById("testSoundBtn");
    const audioStatusPill = document.getElementById("audioStatusPill");
    const statusBanner = document.getElementById("statusBanner");
    const phaseTitle = document.getElementById("phaseTitle");
    const phaseSub = document.getElementById("phaseSub");
    const bigClock = document.getElementById("bigClock");
    const stepBadge = document.getElementById("stepBadge");
    const progressBar = document.getElementById("progressBar");
    const rocketMarker = document.getElementById("rocketMarker");
    const zoneStateChip = document.getElementById("zoneStateChip");
    const targetZoneName = document.getElementById("targetZoneName");
    const primaryBtn = document.getElementById("primaryBtn");
    const resetBtn = document.getElementById("resetBtn");
    const segEls = Array.from({ length: 8 }, (_, i) => document.getElementById(`seg${i}`));

    /**
     * Bulletproof Offline Dual-Engine Audio System
     * 1. Web Audio API with synchronous iOS touch unlock + navigator.audioSession.type = 'playback'
     * 2. Base64 16-bit PCM RIFF/WAVE HTML5 <audio playsinline> fallback pool
     */
    const DualAudioEngine = (() => {
      let audioCtx = null;
      let unlocked = false;
      let statusTimer = null;
      const wavPools = {};
      const poolIndex = {};

      function setAudioStatus(label, isSuccess = true) {
        if (!audioStatusPill) return;
        audioStatusPill.textContent = label;
        audioStatusPill.className = isSuccess
          ? "px-2 py-1 rounded-full bg-[#103b37] border border-[#34d399] text-[11px] font-bold text-emerald-300 whitespace-nowrap"
          : "px-2 py-1 rounded-full bg-[#11193d] border border-[#283873] text-[11px] font-bold text-slate-300 whitespace-nowrap";

        clearTimeout(statusTimer);
        if (isSuccess) {
          statusTimer = setTimeout(() => {
            audioStatusPill.textContent = soundEnabled ? "Audio On" : "Muted";
            audioStatusPill.className = "px-2 py-1 rounded-full bg-[#11193d] border border-[#283873] text-[11px] font-bold text-slate-300 whitespace-nowrap";
          }, 2200);
        }
      }

      // Generate a 16-bit mono PCM WAV data URI from tone segments
      function buildWavDataUri(segments, sampleRate = 22050) {
        let totalSamples = 0;
        segments.forEach((seg) => {
          totalSamples += Math.ceil((seg.duration + (seg.gap || 0)) * sampleRate);
        });

        const dataBytes = totalSamples * 2;
        const buffer = new ArrayBuffer(44 + dataBytes);
        const view = new DataView(buffer);

        function writeStr(offset, str) {
          for (let i = 0; i < str.length; i++) {
            view.setUint8(offset + i, str.charCodeAt(i));
          }
        }

        writeStr(0, "RIFF");
        view.setUint32(4, 36 + dataBytes, true);
        writeStr(8, "WAVE");
        writeStr(12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true); // PCM
        view.setUint16(22, 1, true); // Mono
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeStr(36, "data");
        view.setUint32(40, dataBytes, true);

        let sampleCursor = 0;
        segments.forEach((seg) => {
          const toneSamples = Math.ceil(seg.duration * sampleRate);
          const gapSamples = Math.ceil((seg.gap || 0) * sampleRate);
          let phase = 0;

          for (let i = 0; i < toneSamples; i++) {
            const t = i / toneSamples;
            const freq = seg.slideTo
              ? seg.freq * Math.pow(seg.slideTo / seg.freq, t)
              : seg.freq;
            phase += (2 * Math.PI * freq) / sampleRate;

            let wave = Math.sin(phase);
            if (seg.type === "triangle") {
              wave = (2 / Math.PI) * Math.asin(Math.sin(phase));
            }

            // Smooth attack and exponential release
            const attack = Math.min(1, i / (sampleRate * 0.015));
            const release = Math.pow(1 - t, 1.3);
            const sampleVal = Math.max(-1, Math.min(1, wave * (seg.gain || 0.45) * attack * release));
            view.setInt16(44 + sampleCursor * 2, sampleVal * 32767, true);
            sampleCursor++;
          }

          for (let g = 0; g < gapSamples; g++) {
            view.setInt16(44 + sampleCursor * 2, 0, true);
            sampleCursor++;
          }
        });

        const bytes = new Uint8Array(buffer);
        let binary = "";
        const chunkSize = 0x8000;
        for (let i = 0; i < bytes.length; i += chunkSize) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
        }
        return "data:audio/wav;base64," + btoa(binary);
      }

      // Pre-synthesize offline WAV pools for all 4 sound cues
      function initWavPools() {
        const defs = {
          confirm: [
            { freq: 659.25, duration: 0.12, type: "sine", gain: 0.45 }
          ],
          switch: [
            { freq: 587.33, duration: 0.14, gap: 0.03, type: "triangle", gain: 0.5 },
            { freq: 880.00, duration: 0.24, type: "triangle", gain: 0.55 }
          ],
          spit: [
            { freq: 523.25, duration: 0.11, gap: 0.03, type: "sine", gain: 0.45 },
            { freq: 659.25, duration: 0.11, gap: 0.05, type: "sine", gain: 0.45 },
            { freq: 310, slideTo: 980, duration: 0.18, gap: 0.03, type: "sine", gain: 0.55 },
            { freq: 410, slideTo: 1220, duration: 0.20, type: "sine", gain: 0.55 }
          ],
          fanfare: [
            { freq: 523.25, duration: 0.13, gap: 0.02, type: "triangle", gain: 0.5 },
            { freq: 659.25, duration: 0.13, gap: 0.02, type: "triangle", gain: 0.5 },
            { freq: 783.99, duration: 0.13, gap: 0.02, type: "triangle", gain: 0.5 },
            { freq: 1046.50, duration: 0.50, type: "triangle", gain: 0.58 }
          ]
        };

        Object.keys(defs).forEach((name) => {
          const uri = buildWavDataUri(defs[name]);
          wavPools[name] = [0, 1].map(() => {
            const audio = new Audio(uri);
            audio.setAttribute("playsinline", "");
            audio.preload = "auto";
            return audio;
          });
          poolIndex[name] = 0;
        });
      }

      initWavPools();

      function unlockSync() {
        try {
          // iOS Safari 17+ silent-switch bypass
          if (navigator.audioSession && navigator.audioSession.type !== "playback") {
            navigator.audioSession.type = "playback";
          }
        } catch (e) {
          // Ignore if unsupported
        }

        try {
          if (!audioCtx) {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              audioCtx = new AudioCtx();
            }
          }
          if (audioCtx && audioCtx.state === "suspended") {
            audioCtx.resume();
          }
          if (audioCtx && !unlocked) {
            const silentBuf = audioCtx.createBuffer(1, 1, 22050);
            const src = audioCtx.createBufferSource();
            src.buffer = silentBuf;
            src.connect(audioCtx.destination);
            src.start(0);
            unlocked = true;
          }
        } catch (e) {
          console.warn("WebAudio unlock notice:", e);
        }
      }

      function scheduleWebTone(freq, startTime, duration, type = "sine", peakGain = 0.3, slideTo = null) {
        if (!audioCtx) return;
        const t0 = Math.max(startTime, audioCtx.currentTime);
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + duration);
        }

        gain.gain.setValueAtTime(0.001, t0);
        gain.gain.exponentialRampToValueAtTime(Math.max(0.002, peakGain), t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(t0);
        osc.stop(t0 + duration + 0.03);
      }

      function playWavFallback(cueName) {
        const pool = wavPools[cueName];
        if (!pool || !pool.length) return;
        const idx = poolIndex[cueName] % pool.length;
        poolIndex[cueName] += 1;
        const el = pool[idx];
        try {
          el.currentTime = 0;
          const playPromise = el.play();
          if (playPromise && typeof playPromise.then === "function") {
            playPromise
              .then(() => setAudioStatus("✓ WAV Audio", true))
              .catch(() => setAudioStatus("Tap to Unmute", false));
          } else {
            setAudioStatus("✓ WAV Audio", true);
          }
        } catch (e) {
          setAudioStatus("Tap to Unmute", false);
        }
      }

      function playCue(cueName) {
        if (!soundEnabled) return;
        unlockSync();

        // Use Web Audio API when running cleanly; fall back to HTML5 WAV pool otherwise
        if (audioCtx && audioCtx.state === "running") {
          const now = audioCtx.currentTime;
          if (cueName === "confirm") {
            scheduleWebTone(659.25, now, 0.11, "sine", 0.25);
          } else if (cueName === "switch") {
            scheduleWebTone(587.33, now, 0.14, "triangle", 0.34);
            scheduleWebTone(880.00, now + 0.16, 0.24, "triangle", 0.36);
          } else if (cueName === "spit") {
            scheduleWebTone(523.25, now, 0.12, "sine", 0.30);
            scheduleWebTone(659.25, now + 0.14, 0.12, "sine", 0.30);
            scheduleWebTone(310, now + 0.30, 0.18, "sine", 0.38, 980);
            scheduleWebTone(410, now + 0.50, 0.20, "sine", 0.38, 1220);
          } else if (cueName === "fanfare") {
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((n, idx) => {
              scheduleWebTone(n, now + idx * 0.14, idx === 3 ? 0.55 : 0.15, "triangle", 0.36);
            });
          }
          setAudioStatus("✓ WebAudio", true);
        } else {
          playWavFallback(cueName);
        }
      }

      return {
        unlockSync,
        playConfirm: () => playCue("confirm"),
        playSwitch: () => playCue("switch"),
        playSpit: () => playCue("spit"),
        playFanfare: () => playCue("fanfare"),
        updatePillIdle: () => {
          setAudioStatus(soundEnabled ? "Audio On" : "Muted", false);
        }
      };
    })();

    /**
     * Responsive Celebration Confetti Engine (Dynamic Canvas Sizing)
     */
    const Confetti = (() => {
      const canvas = document.getElementById("confettiCanvas");
      const ctx = canvas.getContext("2d");
      let particles = [];
      let animId = null;

      function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      window.addEventListener("resize", resizeCanvas);
      window.addEventListener("load", resizeCanvas);
      resizeCanvas();

      function launch() {
        resizeCanvas();
        const colors = ["#38bdf8", "#34d399", "#fbbf24", "#f472b6", "#a78bfa", "#ffffff"];
        particles = Array.from({ length: 75 }, () => ({
          x: window.innerWidth * (0.15 + Math.random() * 0.7),
          y: window.innerHeight * 0.38,
          vx: (Math.random() - 0.5) * 9,
          vy: -4 - Math.random() * 7,
          size: 5 + Math.random() * 5,
          color: colors[Math.floor(Math.random() * colors.length)],
          rot: Math.random() * Math.PI * 2,
          vRot: (Math.random() - 0.5) * 0.25,
          life: 1
        }));

        if (animId) cancelAnimationFrame(animId);
        animate();
      }

      function animate() {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        let alive = false;

        particles.forEach((p) => {
          if (p.life <= 0) return;
          alive = true;
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.22; // gravity
          p.vx *= 0.99;
          p.rot += p.vRot;
          p.life -= 0.014;

          ctx.save();
          ctx.globalAlpha = Math.max(0, p.life);
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillStyle = p.color;
          ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.65);
          ctx.restore();
        });

        if (alive) {
          animId = requestAnimationFrame(animate);
        } else {
          ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
          animId = null;
        }
      }

      function clear() {
        if (animId) cancelAnimationFrame(animId);
        animId = null;
        particles = [];
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      }

      return { launch, clear };
    })();

    function formatMMSS(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    /**
     * Render UI State: Clock, Horizontal Rocket Track, 8-Segment Dental Arch, Banner, and Buttons
     */
    function render() {
      const remaining = Math.max(0, 120 - elapsedBrush);
      bigClock.textContent = formatMMSS(remaining);

      // Update horizontal progress bar & rocket position (0% -> 100%)
      const pct = Math.min(100, (elapsedBrush / 120) * 100);
      progressBar.style.width = `${pct}%`;
      rocketMarker.style.left = `${pct}%`;

      const stepIdx = Math.min(7, Math.floor(elapsedBrush / 15));
      const currentStep = INTERVALS[stepIdx];
      const secLeftInSlice = elapsedBrush >= 120 ? 0 : (15 - (elapsedBrush % 15));

      // Update Step Badge
      if (elapsedBrush >= 120) {
        stepBadge.textContent = "8 of 8 • Done!";
      } else if (pauseMode) {
        stepBadge.textContent = `Step ${stepIdx + 1} of 8 • Ready?`;
      } else {
        stepBadge.textContent = `Step ${stepIdx + 1} of 8 • ${secLeftInSlice}s left`;
      }

      // Update Target Zone Name, Chip & Dental Arch SVG
      targetZoneName.textContent = elapsedBrush >= 120 ? "All Zones Clean!" : currentStep.zone;
      segEls.forEach((el, idx) => {
        el.classList.remove("arch-seg-active", "arch-seg-next-pulse", "arch-seg-done");
        if (elapsedBrush >= 120) {
          el.classList.add("arch-seg-done");
        } else if (idx === stepIdx) {
          el.classList.add(pauseMode ? "arch-seg-next-pulse" : "arch-seg-active");
        } else if (idx < stepIdx) {
          el.classList.add("arch-seg-done");
        }
      });

      // Reset banner & button classes before applying current state
      statusBanner.className = "rounded-2xl px-3.5 py-2.5 text-center border transition-colors duration-200 shadow-md";
      rocketMarker.classList.remove("thrusting", "hovering");
      primaryBtn.className = "w-full py-3.5 px-4 rounded-2xl active:scale-[0.98] font-black text-base sm:text-lg shadow-lg transition cursor-pointer";

      if (elapsedBrush >= 120) {
        // Completed 2:00 Mission
        statusBanner.classList.add("bg-[#102d2b]", "border-[#34d399]");
        phaseTitle.textContent = "🌟 BLAST OFF!";
        phaseSub.textContent = "Mission complete! Give one final spit and rinse.";
        rocketMarker.classList.add("hovering");

        zoneStateChip.textContent = "Complete";
        zoneStateChip.className = "px-2 py-0.5 rounded-md bg-[#103b37] border border-[#34d399] text-[10px] font-extrabold uppercase tracking-wider text-emerald-300";

        primaryBtn.textContent = "🚀 Brush Again";
        primaryBtn.classList.add("bg-gradient-to-r", "from-emerald-400", "to-teal-500", "text-slate-950");
      } else if (pauseMode === "switch") {
        // Manual 15s Switch Sides Pause (Waits indefinitely for tap)
        statusBanner.classList.add("bg-[#2b2011]", "border-[#f59e0b]");
        phaseTitle.textContent = "🔄 SWITCH SIDES!";
        phaseSub.textContent = `Move toothbrush to: ${currentStep.zone}`;
        rocketMarker.classList.add("hovering");

        zoneStateChip.textContent = "Next Up";
        zoneStateChip.className = "px-2 py-0.5 rounded-md bg-[#3a2a12] border border-[#f59e0b] text-[10px] font-extrabold uppercase tracking-wider text-amber-300";

        primaryBtn.textContent = "🔄 Switched Sides — Tap When Ready!";
        primaryBtn.classList.add("bg-gradient-to-r", "from-amber-400", "to-orange-500", "text-slate-950", "pulse-amber");
      } else if (pauseMode === "spit") {
        // Manual 30s Spit Pause (Waits indefinitely for tap)
        statusBanner.classList.add("bg-[#2e1329]", "border-[#f472b6]");
        phaseTitle.textContent = "💧 SPIT IN THE SINK!";
        phaseSub.textContent = `Don't swallow! Next up: ${currentStep.zone}`;
        rocketMarker.classList.add("hovering");

        zoneStateChip.textContent = "Next Up";
        zoneStateChip.className = "px-2 py-0.5 rounded-md bg-[#3d1736] border border-[#f472b6] text-[10px] font-extrabold uppercase tracking-wider text-pink-300";

        primaryBtn.textContent = "💧 Spat Out — Tap When Ready!";
        primaryBtn.classList.add("bg-gradient-to-r", "from-pink-400", "to-rose-500", "text-white", "pulse-pink");
      } else if (isRunning) {
        // Active Brushing
        statusBanner.classList.add("bg-[#122657]", "border-[#38bdf8]");
        phaseTitle.textContent = `🪥 Brush: ${currentStep.zone}`;
        const nextAction =
          currentStep.pauseAfter === "spit" ? "Spit break" :
          currentStep.pauseAfter === "switch" ? "Switch sides" : "Blast off";
        phaseSub.textContent = `${nextAction} in ${secLeftInSlice}s`;
        rocketMarker.classList.add("thrusting");

        zoneStateChip.textContent = "Brushing";
        zoneStateChip.className = "px-2 py-0.5 rounded-md bg-[#163375] border border-[#38bdf8] text-[10px] font-extrabold uppercase tracking-wider text-sky-300";

        primaryBtn.textContent = "⏸ Pause";
        primaryBtn.classList.add("bg-gradient-to-r", "from-sky-400", "to-blue-600", "text-white");
      } else {
        // Idle or User Paused
        statusBanner.classList.add("bg-[#12224c]", "border-[#3268b8]");
        phaseTitle.textContent = elapsedBrush === 0 ? "Ready for Liftoff!" : "Mission Paused";
        phaseSub.textContent = elapsedBrush === 0
          ? "Switch every 15s • Spit in sink every 30s"
          : `Ready to brush: ${currentStep.zone}`;

        zoneStateChip.textContent = elapsedBrush === 0 ? "Start" : "Paused";
        zoneStateChip.className = "px-2 py-0.5 rounded-md bg-[#18265c] border border-[#324a9c] text-[10px] font-extrabold uppercase tracking-wider text-sky-300";

        primaryBtn.textContent = elapsedBrush === 0 ? "🚀 Start Brushing" : "▶️ Resume Brushing";
        primaryBtn.classList.add("bg-gradient-to-r", "from-sky-400", "to-blue-600", "text-white");
      }
    }

    /**
     * 1-second timer tick: stops completely at 15s and 30s marks until user taps confirm
     */
    function onTick() {
      if (!isRunning || pauseMode) return;

      elapsedBrush += 1;

      if (elapsedBrush >= 120) {
        isRunning = false;
        clearInterval(timerId);
        DualAudioEngine.playFanfare();
        Confetti.launch();
        render();
        return;
      }

      if (elapsedBrush % 30 === 0) {
        isRunning = false;
        clearInterval(timerId);
        pauseMode = "spit";
        DualAudioEngine.playSpit();
      } else if (elapsedBrush % 15 === 0) {
        isRunning = false;
        clearInterval(timerId);
        pauseMode = "switch";
        DualAudioEngine.playSwitch();
      }

      render();
    }

    // Primary Button handles Start, Pause, Resume, Tap-to-Confirm, and Brush Again
    primaryBtn.addEventListener("click", () => {
      DualAudioEngine.unlockSync();

      if (elapsedBrush >= 120) {
        // Restart mission
        Confetti.clear();
        elapsedBrush = 0;
        pauseMode = null;
        isRunning = true;
        DualAudioEngine.playConfirm();
        clearInterval(timerId);
        timerId = setInterval(onTick, 1000);
        render();
        return;
      }

      if (pauseMode) {
        // User tapped confirm after switching sides or spitting
        pauseMode = null;
        isRunning = true;
        DualAudioEngine.playConfirm();
        clearInterval(timerId);
        timerId = setInterval(onTick, 1000);
        render();
        return;
      }

      // Toggle Start / Pause
      isRunning = !isRunning;
      clearInterval(timerId);
      if (isRunning) {
        DualAudioEngine.playConfirm();
        timerId = setInterval(onTick, 1000);
      }
      render();
    });

    resetBtn.addEventListener("click", () => {
      isRunning = false;
      clearInterval(timerId);
      Confetti.clear();
      elapsedBrush = 0;
      pauseMode = null;
      render();
    });

    soundToggle.addEventListener("click", () => {
      soundEnabled = !soundEnabled;
      safeSet("rocket_brush_sound", soundEnabled);
      soundToggle.textContent = soundEnabled ? "🔊 Sound" : "🔇 Muted";
      if (soundEnabled) {
        DualAudioEngine.unlockSync();
        DualAudioEngine.playConfirm();
      } else {
        DualAudioEngine.updatePillIdle();
      }
    });

    testSoundBtn.addEventListener("click", () => {
      if (!soundEnabled) {
        soundEnabled = true;
        safeSet("rocket_brush_sound", true);
        soundToggle.textContent = "🔊 Sound";
      }
      DualAudioEngine.unlockSync();
      DualAudioEngine.playSwitch();
      setTimeout(() => {
        DualAudioEngine.playSpit();
      }, 650);
    });

    // Global first-touch listener for iOS Safari/PWA audio unlock
    document.addEventListener("touchstart", () => DualAudioEngine.unlockSync(), { once: true, passive: true });
    document.addEventListener("click", () => DualAudioEngine.unlockSync(), { once: true });

    // Initialize UI
    soundToggle.textContent = soundEnabled ? "🔊 Sound" : "🔇 Muted";
    DualAudioEngine.updatePillIdle();
    render();
  </script>
</body>
